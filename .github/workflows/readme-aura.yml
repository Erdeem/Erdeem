name: Generate README
on:
  push:
    branches: [main]
    paths: ['readme.source.md', '.github/workflows/**']
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-calculate real language bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            async function calculate() {
              const username = "${{ github.repository_owner }}";
              const headers = { "User-Agent": "Node-Fetch", "Authorization": "token " + process.env.GITHUB_TOKEN };
              const res = await fetch("https://api.github.com/users/" + username + "/repos?per_page=100", { headers });
              const repos = await res.json();
              const bytes = {};
              const colors = {
                Ruby: "#cc342d",
                PowerShell: "#5391fe",
                Batchfile: "#c1f12e",
                JavaScript: "#f1e05a",
                TypeScript: "#3178c6",
                Python: "#3776ab",
                HTML: "#e34c26",
                CSS: "#563d7c",
                Shell: "#89e051",
                "C++": "#f34b7d",
                "C#": "#178600",
                Java: "#b07219",
                Go: "#00add8",
                Rust: "#dea584"
              };

              for (const repo of repos) {
                if (repo.fork) continue;
                try {
                  const lr = await fetch(repo.languages_url, { headers });
                  const ld = await lr.json();
                  for (const [k, v] of Object.entries(ld)) {
                    bytes[k] = (bytes[k] || 0) + v;
                  }
                } catch(e) {}
              }

              const total = Object.values(bytes).reduce((a, b) => a + b, 0);
              if (!total) return;

              const top = Object.entries(bytes)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([name, count]) => ({
                  name,
                  percentage: Math.round((count / total) * 100),
                  color: colors[name] || "#8b5cf6"
                }));

              let src = fs.readFileSync("readme.source.md", "utf8");
              src = src.replace(/\/\* AUTO_LANGS \*\/[\s\S]*?\/\* END_AUTO_LANGS \*\//, "/* AUTO_LANGS */\n  var langs = " + JSON.stringify(top) + ";\n  /* END_AUTO_LANGS */");
              fs.writeFileSync("readme.source.md", src, "utf8");
            }
            calculate();
          '

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
